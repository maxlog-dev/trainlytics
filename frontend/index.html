    <!-- What shows from the first paint (once the CSS bundle has loaded, which blocks
         rendering) until React mounts, i.e. while the JS bundle downloads and runs:
         brand background (--color-bg) and the logo in #root, which React replaces.
         The iOS launch images are screenshots of this same markup; after changing it,
         re-run `node scripts/generate-splash.mjs` so the two match. -->
    <style id="boot-style">
      html,
      body {
        margin: 0;
        background: #f7f5ef;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash svg {
        width: 200px;
        height: auto;
      }
    </style>
    <!-- The logo's wordmark font, fetched alongside the CSS rather than after layout, so
         the placeholder doesn't paint in a fallback font and then swap. Vite rewrites
         the path to the same hashed file the CSS uses. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2" />
