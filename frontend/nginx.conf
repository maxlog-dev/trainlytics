server {
    listen 80;

    client_max_body_size 500m;

    # nginx:alpine ships with gzip off, so the JS bundle went out uncompressed
    # (~1.2 MB instead of ~350 KB). text/html is always included once gzip is on,
    # and application/json covers the /api/ responses too (the backend doesn't
    # compress). Fonts and PNGs are already compressed and are left out.
    # gzip_proxied any: still compress when a front proxy adds a Via header.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # The bundle entry: browsers revalidate it, so a deploy's new hashed assets are
    # picked up. `/` and SPA routes (the try_files fallback) end up here too.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every file name under /assets/, so a file never
    # changes and can be cached for a year. A missing file is a 404, not the SPA
    # fallback: an old tab asking for a deleted chunk must not get index.html
    # cached as JavaScript for a year.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker is how clients learn about a deploy: the browser compares
    # it byte for byte on every update check, so it must never come from a cache.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # nginx's mime.types has no entry for .webmanifest (it would go out as
    # application/octet-stream and skip gzip). An empty `types` here, not in the
    # server block: a `types` block replaces the whole inherited map.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # A host name in proxy_pass is resolved once, at nginx start; a recreated
        # backend container gets a new IP and requests would 502. Resolving per
        # request (cached 10s) follows it. The image's entrypoint fills in the
        # container's nameserver (Docker: 127.0.0.11) from /etc/resolv.conf, see
        # NGINX_ENTRYPOINT_LOCAL_RESOLVERS in the Dockerfile.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        # No URI part, so the request URI is passed on unchanged, as before
        proxy_pass $backend_upstream;
        # Fail fast instead of hanging on a stale cached backend IP
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
